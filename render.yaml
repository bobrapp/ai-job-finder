services:
  - type: web
    name: technical-writing-job-assistant
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PORT
        value: 8501
      - key: STREAMLIT_SERVER_PORT
        value: 8501
      - key: STREAMLIT_SERVER_ADDRESS
        value: 0.0.0.0
